services:
  api:
    image: node:20-alpine
    working_dir: /app/server
    volumes:
      - ./server:/app/server
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CLIENT_ORIGIN=http://localhost:5173

  web:
    image: node:20-alpine
    working_dir: /app/client
    volumes:
      - ./client:/app/client
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_PROXY_TARGET=http://api:4000
    depends_on:
      - api
